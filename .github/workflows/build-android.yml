name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Create Android Project
      run: |
        mkdir -p app/src/main/java/com/sms/gateway
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi
    
    - name: Copy Source Files
      run: |
        cp android/MainActivity.kt app/src/main/java/com/sms/gateway/ || echo "MainActivity not found"
        cp android/SmsReceiver.kt app/src/main/java/com/sms/gateway/ || echo "SmsReceiver not found"
        cp android/AndroidManifest.xml app/src/main/ || echo "Manifest not found"
    
    - name: Create build.gradle (app)
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            compileSdkVersion 33
            
            defaultConfig {
                applicationId "com.sms.gateway"
                minSdkVersion 21
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            
            kotlinOptions {
                jvmTarget = '1.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
        }
        EOF
    
    - name: Create settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        rootProject.name = 'SmsGateway'
        include ':app'
        EOF
    
    - name: Create build.gradle (project)
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            ext.kotlin_version = "1.8.0"
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
    
    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF
    
    - name: Create strings.xml
      run: |
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">SMS Gateway</string>
        </resources>
        EOF
    
    - name: Build with Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip gradle-7.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-7.5
        export PATH=$PATH:$GRADLE_HOME/bin
        gradle wrapper --gradle-version 7.5
        ./gradlew assembleDebug --stacktrace
      continue-on-error: true
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
      if: success()
